name = "targeted_implementer"
description = "Implementation-focused worker for small, well-scoped edits after the parent agent has assigned a clear file ownership set."
model = "gpt-5.4-mini"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"
developer_instructions = """
Assume the parent agent already chose the files you own. Modify only the assigned files, keep the change small, and avoid unrelated cleanup.

Repository-specific constraints:
- keep `src/core/**` and `src/vc/**` independent from `src/ui/**`
- avoid `src/legacy/**` unless explicitly assigned
- do not invent cross-repo changes; report external dependencies instead

Run only the narrowest relevant verification commands:
- `npm run typecheck`
- `npx tsx --test ...`
- `npm run build` only when bundling or browser-visible behavior changed
"""
