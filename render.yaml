services:
  - type: web
    name: iu-vc-cert-university
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./deployments/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: BASE_URL
        sync: false
      - key: OID4VCI_BASE_URL
        sync: false
      - key: ISSUER_DID
        sync: false
      - key: SCHEMA_URL
        sync: false
      - key: DEGREE_CONTEXT_URL
        sync: false
      - key: IU_SMARTCERT_CONTEXT_URL
        sync: false
      - key: MERKLE_CONTEXT_URL
        sync: false
      - key: CHAIN_ID
        value: "eip155:11155111"
      - key: VERIFIER_POLICY_RPC_URL
        sync: false
      # Server-only private signing key (Never exposed to browser bundle)
      - key: OID4VCI_PRIVATE_JWK
        sync: false
